name: Build

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Resolve package version
        id: version
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          [xml] $props = Get-Content -Raw Directory.Build.props
          $projectVersion = [string] $props.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($projectVersion)) {
            throw "Directory.Build.props does not define Version."
          }

          $version = $projectVersion
          if ($env:REF_TYPE -eq "tag") {
            if ($env:REF_NAME -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
              throw "Release tags must use the vMAJOR.MINOR.PATCH format."
            }

            $version = $Matches.version
            if ($version -ne $projectVersion) {
              throw "Tag version $version does not match project version $projectVersion."
            }
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "setup_name=TextRecast-v$version-win-x64-setup" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore dependencies
        run: dotnet restore TextRecast.slnx

      - name: Verify formatting
        run: dotnet format TextRecast.slnx --no-restore --verify-no-changes

      - name: Run tests
        run: dotnet test TextRecast.slnx -c Release --no-restore

      - name: Build release
        run: dotnet build TextRecast.slnx -c Release --no-restore

      - name: Verify setup dependency boundary
        shell: pwsh
        run: |
          [xml] $setupProject = Get-Content -Raw src/TextRecast.Setup/TextRecast.Setup.csproj
          [xml] $deploymentProject = Get-Content -Raw src/TextRecast.Deployment/TextRecast.Deployment.csproj

          $setupReferences = @($setupProject.SelectNodes("//ProjectReference") | ForEach-Object { $_.Include })
          if ($setupReferences.Count -ne 1 -or
              $setupReferences[0] -ne "..\TextRecast.Deployment\TextRecast.Deployment.csproj") {
            throw "The setup host must reference only TextRecast.Deployment."
          }

          if (@($deploymentProject.SelectNodes("//PackageReference")).Count -ne 0) {
            throw "TextRecast.Deployment must remain package-free."
          }

          if (@($setupProject.SelectNodes("//PackageReference")).Count -ne 0) {
            throw "The setup host must remain package-free."
          }

      - name: Publish self-contained application
        run: >-
          dotnet publish src/TextRecast.App/TextRecast.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          --no-restore
          -p:Version=${{ steps.version.outputs.version }}
          -o artifacts/publish/TextRecast-win-x64

      - name: Prepare controlled upgrade fixture
        shell: pwsh
        run: |
          $source = (Resolve-Path "artifacts/publish/TextRecast-win-x64").Path
          $fixture = Join-Path $PWD "artifacts/smoke/previous-publish"
          New-Item -ItemType Directory -Path $fixture -Force | Out-Null
          Copy-Item -Path (Join-Path $source "*") -Destination $fixture -Recurse -Force
          Set-Content -LiteralPath (Join-Path $fixture "obsolete-v0.1-fixture.txt") -Value "upgrade fixture" -NoNewline

      - name: Build controlled upgrade installer fixture
        shell: pwsh
        run: >-
          ./tools/Build-WindowsInstaller.ps1
          -Version 0.1.0
          -PublishDirectory artifacts/smoke/previous-publish
          -OutputDirectory artifacts/smoke/previous
          -NoRestore

      - name: Build Windows setup
        shell: pwsh
        run: >-
          ./tools/Build-WindowsInstaller.ps1
          -Version ${{ steps.version.outputs.version }}
          -PublishDirectory artifacts/publish/TextRecast-win-x64
          -OutputDirectory artifacts/release
          -NoRestore

      - name: Smoke test install, launch, payload replacement, uninstall, and reinstall
        shell: pwsh
        run: >-
          ./tools/Test-WindowsInstaller.ps1
          -SetupPath artifacts/release/${{ steps.version.outputs.setup_name }}.exe
          -ExpectedVersion ${{ steps.version.outputs.version }}
          -PreviousSetupPath artifacts/smoke/previous/TextRecast-v0.1.0-win-x64-setup.exe
          -PreviousVersion 0.1.0
          -UpgradeFixtureFileName obsolete-v0.1-fixture.txt

      - name: Upload Windows setup
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.setup_name }}
          path: |
            artifacts/release/${{ steps.version.outputs.setup_name }}.exe
            artifacts/release/${{ steps.version.outputs.setup_name }}.exe.sha256
          if-no-files-found: error
